[package]
name = "sage"
version = "0.12.9"
edition = "2024"
license = "Apache-2.0"
description = "A high level abstraction for running Sage wallet."
authors = ["Rigidity <me@rigidnetwork.com>"]
homepage = "https://github.com/rigidity/sage"
repository = "https://github.com/rigidity/sage"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
default = ["native"]
native = [
    "dep:chia-wallet-sdk",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "sage-wallet/native",
    "sage-database/sqlite",
    "sage-assets/native",
]

[dependencies]
sage-api = { workspace = true }
sage-database = { workspace = true }
sage-config = { workspace = true }
sage-keychain = { workspace = true }
sage-wallet = { workspace = true }
sage-assets = { workspace = true }

# Full SDK is only needed for networking and peers (native)
chia-wallet-sdk = { workspace = true, features = ["rustls"], optional = true }

# Individual chia sub-crates, available on every target
chia-bls = { workspace = true }
chia-protocol = { workspace = true }
chia-sdk-driver = { workspace = true }
chia-sdk-signer = { workspace = true }
chia-sdk-utils = { workspace = true }
clvm-traits = { workspace = true }
clvmr = { workspace = true }

# Native-only dependencies
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
tracing-appender = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"], optional = true }
tokio = { workspace = true, optional = true }

cfg-if = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
toml = { workspace = true, features = ["preserve_order"] }
hex = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
bip39 = { workspace = true }
itertools = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
bech32 = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
