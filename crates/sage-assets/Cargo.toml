[package]
name = "sage-assets"
version = "0.12.9"
edition = "2024"
license = "Apache-2.0"
description = "Fetches non-critical data from various APIs for use in Sage wallet."
authors = ["Rigidity <me@rigidnetwork.com>"]
homepage = "https://github.com/rigidity/sage"
repository = "https://github.com/rigidity/sage"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
default = ["native"]
native = [
    "dep:chia-wallet-sdk",
    "dep:futures-lite",
    "dep:futures-util",
    "dep:mime-sniffer",
    "dep:image",
    "dep:webp",
    "dep:tokio",
    "dep:base64",
]

[dependencies]
# Native-only: URI fetching and thumbnail generation
chia-wallet-sdk = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
mime-sniffer = { workspace = true, optional = true }
image = { workspace = true, optional = true }
webp = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
base64 = { workspace = true, optional = true }

# Portable: CHIP-0007 metadata parsing, the shared asset data shapes, and the
# Dexie token metadata lookup. On wasm reqwest goes through the browser's fetch,
# so it needs no TLS backend of its own.
reqwest = { workspace = true, default-features = false, features = ["json"] }
chia-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
num-bigint = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["http2", "rustls-tls-webpki-roots", "json"] }
