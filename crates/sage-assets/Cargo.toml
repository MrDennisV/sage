[package]
name = "sage-assets"
version = "0.12.11"
edition = "2024"
license = "Apache-2.0"
description = "Fetches non-critical data from various APIs for use in Sage wallet."
authors = ["Rigidity <me@rigidnetwork.com>"]
homepage = "https://github.com/rigidity/sage"
repository = "https://github.com/rigidity/sage"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
default = ["native"]
native = [
    "dep:chia-wallet-sdk",
    "dep:tokio",
    "dep:base64",
]

[dependencies]
# Native-only: the thumbnail cache and the puzzle types behind it.
chia-wallet-sdk = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
base64 = { workspace = true, optional = true }

# Portable: downloading an NFT's content and sizing it down.
futures-lite = { workspace = true }
futures-util = { workspace = true }
mime-sniffer = { workspace = true }
chia-sha2 = { workspace = true }

# Portable: CHIP-0007 metadata parsing, the shared asset data shapes, and the
# Dexie token metadata lookup. On wasm reqwest goes through the browser's fetch,
# so it needs no TLS backend of its own.
reqwest = { workspace = true, default-features = false, features = ["json"] }
chia-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
num-bigint = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["http2", "rustls-tls-webpki-roots", "json"] }
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# libwebp is C, so it only builds natively. The image crate carries a decoder of
# its own, which is what the browser uses instead.
webp = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }
