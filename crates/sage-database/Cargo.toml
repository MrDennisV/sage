[package]
name = "sage-database"
version = "0.12.9"
edition = "2024"
license = "Apache-2.0"
description = "The SQLite database for Sage."
authors = ["Rigidity <me@rigidnetwork.com>"]
homepage = "https://github.com/rigidity/sage"
repository = "https://github.com/rigidity/sage"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx", "dep:chia-wallet-sdk"]

[dependencies]
# Full SDK is only needed by the sqlite (native) implementation
chia-wallet-sdk = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["sqlite"], optional = true }

# Individual chia sub-crates for types, available on every target
chia-bls = { workspace = true }
chia-protocol = { workspace = true }
chia-sdk-driver = { workspace = true }
clvm-traits = { workspace = true }
clvmr = { workspace = true }

cfg-if = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
