[package]
name = "sage-wallet"
version = "0.12.9"
edition = "2024"
license = "Apache-2.0"
description = "The driver code and sync logic for Sage wallet."
authors = ["Rigidity <me@rigidnetwork.com>"]
homepage = "https://github.com/rigidity/sage"
repository = "https://github.com/rigidity/sage"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
default = ["native"]
native = [
    "dep:chia-wallet-sdk",
    "dep:tokio",
    "dep:reqwest",
    "dep:sage-config",
    "dep:futures-util",
    "dep:futures-lite",
    "sage-assets/native",
    "sage-database/sqlite",
]
coinset = ["dep:chia-sdk-coinset"]

[dependencies]
# Full SDK is only needed for networking and peers (native)
chia-wallet-sdk = { workspace = true, optional = true }

# Individual chia sub-crates, available on every target
chia-bls = { workspace = true }
chia-protocol = { workspace = true }
chia-puzzle-types = { workspace = true }
chia-puzzles = { workspace = true }
chia-sdk-driver = { workspace = true }
chia-sdk-signer = { workspace = true }
chia-sdk-types = { workspace = true }
chia-sdk-utils = { workspace = true }
clvm-traits = { workspace = true }
clvm-utils = { workspace = true }
clvmr = { workspace = true }
chia_streamable_macro = { workspace = true }
chia-traits = { workspace = true }
chia-sha2 = { workspace = true }

chia-sdk-coinset = { workspace = true, optional = true }
sage-assets = { workspace = true }
sage-database = { workspace = true }

# Native-only dependencies
sage-config = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
futures-util = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, features = ["http2", "rustls-tls-webpki-roots", "json"], optional = true }

base64 = { workspace = true }
cfg-if = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
itertools = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[dev-dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio"] }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true }
hex-literal = { workspace = true }
